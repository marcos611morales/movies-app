<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Explorar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="{{ vars }}">
<div style="width: 390px; height: 1180px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Instrument Sans', system-ui, sans-serif">
  <div style="padding: 56px 24px 120px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.02em">Explorar</h1>
      <button type="button" aria-label="Filtros" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.8; stroke-linecap: round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>
      </button>
    </div>

    <div role="tablist" style="display: flex; gap: 8px">
      <button role="tab" aria-selected="true" style="height: 36px; padding: 0 16px; border-radius: 999px; border: 0; background: var(--primary); color: var(--onPrimary); font: inherit; font-size: 14px; font-weight: 600">Películas</button>
      <button role="tab" aria-selected="false" style="height: 36px; padding: 0 16px; border-radius: 999px; border: 0; background: var(--elev); color: var(--text2); font: inherit; font-size: 14px; font-weight: 600">Series</button>
    </div>

    <section style="display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted)">Géneros</h2>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{ genres }}" as="g" hint-placeholder-count="8">
          <button type="button" aria-pressed="{{ g.on }}" onClick="{{ g.pick }}" style="height: 56px; padding: 0 16px; border-radius: 14px; border: 1px solid {{ g.border }}; background: {{ g.bg }}; color: {{ g.fg }}; font: inherit; font-size: 15px; font-weight: 600; text-align: left; cursor: pointer">{{ g.label }}</button>
        </sc-for>
      </div>
    </section>

    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <span style="height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text2)">Ordenar: <strong style="color: var(--text); font-weight: 600">Popularidad</strong></span>
      <span style="height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text2)">Año: <strong style="color: var(--text); font-weight: 600">Todos</strong></span>
      <span style="height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text2)">Calificación: <strong style="color: var(--text); font-weight: 600">7+</strong></span>
    </div>

    <section style="display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px">{{ resultsTitle }}</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{ results }}" as="m" hint-placeholder-count="6">
          <a href="{{ m.href }}" style="display: flex; flex-direction: column; gap: 6px; color: var(--text); text-decoration: none">
            <div style="position: relative; aspect-ratio: 2/3; border-radius: 12px; border: 1px solid var(--border); background: repeating-linear-gradient(135deg, var(--surface) 0 8px, var(--elev) 8px 16px)">
              <span style="position: absolute; top: 6px; left: 6px; padding: 2px 6px; border-radius: 6px; background: var(--overlay); color: {{ m.color }}; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500">★ {{ m.vote }}</span>
            </div>
            <span style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ m.title }}</span>
          </a>
        </sc-for>
      </div>
    </section>
  </div>

  <nav aria-label="Navegación principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 8px 24px; background: var(--surface); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="{{ l.home }}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-size: 11px; font-weight: 600; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Inicio</a>
    <a href="{{ l.search }}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-size: 11px; font-weight: 600; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Buscar</a>
    <a href="{{ l.explore }}" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--primaryText); font-size: 11px; font-weight: 600; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m15.5 8.5-2 5-5 2 2-5z"></path></svg>Explorar</a>
    <a href="{{ l.profile }}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-size: 11px; font-weight: 600; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Perfil</a>
  </nav>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":1180}}'>
const PAL = {
  dark: { bg:'#0E0D0C', surface:'#181614', elev:'#221F1C', border:'#2E2A26', overlay:'rgba(14,13,12,0.72)', text:'#F4EFE8', text2:'#B3ABA1', muted:'#857C72', primary:'#F5B841', pressed:'#D99A22', onPrimary:'#1A1305', primaryText:'#F5B841', accent:'#E5484D', success:'#46C47E', warning:'#F5B841', error:'#E5484D', hi:'#46C47E', mid:'#F5B841', lo:'#E5484D' },
  light: { bg:'#FAF7F2', surface:'#FFFFFF', elev:'#F2EDE5', border:'#E4DDD2', overlay:'rgba(255,255,255,0.85)', text:'#1A1714', text2:'#5C554D', muted:'#766E64', primary:'#F2AE2E', pressed:'#D99A22', onPrimary:'#1A1305', primaryText:'#8A5A00', accent:'#C9363C', success:'#1F8A50', warning:'#9A6500', error:'#C9363C', hi:'#1F8A50', mid:'#9A6500', lo:'#C9363C' }
};
const rc = (v) => (v >= 7 ? 'var(--hi)' : v >= 5 ? 'var(--mid)' : 'var(--lo)');
const GENRES = ['Acción', 'Aventura', 'Animación', 'Comedia', 'Drama', 'Terror', 'Ciencia ficción', 'Documental'];
const RESULTS = [['Órbita cero', 7.9], ['Señal perdida', 7.4], ['Marte rojo', 8.2], ['El umbral', 7.1], ['Proyecto Eco', 7.6], ['Polvo de estrellas', 7.0]];
class Component extends DCLogic {
  state = { genre: 'Ciencia ficción' };
  renderVals() {
    const t = this.props.theme === 'light' ? 'light' : 'dark';
    const vars = {};
    Object.keys(PAL[t]).forEach((k) => { vars['--' + k] = PAL[t][k]; });
    const s = t === 'light' ? 'Light' : '';
    const g = this.state.genre;
    return {
      vars,
      genres: GENRES.map((label) => {
        const on = label === g;
        return { label, on, bg: on ? 'var(--primary)' : 'var(--surface)', fg: on ? 'var(--onPrimary)' : 'var(--text)', border: on ? 'var(--primary)' : 'var(--border)', pick: () => this.setState({ genre: label }) };
      }),
      resultsTitle: g,
      results: RESULTS.map(([title, v]) => ({ title, vote: v.toFixed(1), color: rc(v), href: 'MovieDetail' + s + '.dc.html' })),
      l: { home: 'Home' + s + '.dc.html', search: 'Search' + s + '.dc.html', explore: 'Explore' + s + '.dc.html', profile: 'Profile' + s + '.dc.html' }
    };
  }
}
</script>
</body>
</html>
