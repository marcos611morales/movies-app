<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Buscar · claro</title>
<script src="./viewer.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="{{ vars }}">
<div style="width: 390px; height: 1060px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Instrument Sans', system-ui, sans-serif">
  <div style="padding: 56px 24px 120px; display: flex; flex-direction: column; gap: 20px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.02em">Buscar</h1>

    <div style="position: relative">
      <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar películas, series y personas</label>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="position: absolute; left: 16px; top: 16px; color: var(--muted); stroke-width: 1.8; stroke-linecap: round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input id="q" type="search" value="lisboa" placeholder="Películas, series y personas" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 52px 0 48px; border-radius: 999px; border: 1px solid var(--primary); background: var(--surface); color: var(--text); font: inherit; font-size: 16px; outline: none">
      <button type="button" aria-label="Borrar búsqueda" style="position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; border: 0; background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </button>
    </div>

    <div role="tablist" style="display: flex; gap: 8px">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="4">
        <button role="tab" aria-selected="{{ f.on }}" onClick="{{ f.pick }}" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: {{ f.bg }}; color: {{ f.fg }}; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{ f.label }}</button>
      </sc-for>
    </div>

    <span style="font-size: 13px; color: var(--muted)">{{ count }}</span>

    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{ results }}" as="r" hint-placeholder-count="6">
        <li>
          <a href="{{ r.href }}" style="display: flex; gap: 14px; align-items: center; padding: 10px 0; color: var(--text); text-decoration: none; border-bottom: 1px solid var(--border)">
            <div style="flex: 0 0 56px; height: {{ r.h }}; border-radius: {{ r.radius }}; border: 1px solid var(--border); background: repeating-linear-gradient(135deg, var(--surface) 0 6px, var(--elev) 6px 12px)"></div>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.title }}</span>
              <span style="font-size: 13px; color: var(--text2)">{{ r.meta }}</span>
              <span style="align-self: flex-start; padding: 2px 8px; border-radius: 6px; background: var(--elev); color: var(--text2); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase">{{ r.type }}</span>
            </div>
            <sc-if value="{{ r.hasVote }}" hint-placeholder-val="{{ true }}">
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; color: {{ r.color }}">★ {{ r.vote }}</span>
            </sc-if>
          </a>
        </li>
      </sc-for>
    </ul>
  </div>

  <nav aria-label="Navegación principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 8px 24px; background: var(--surface); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="{{ l.home }}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-size: 11px; font-weight: 600; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Inicio</a>
    <a href="{{ l.search }}" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--primaryText); font-size: 11px; font-weight: 600; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Buscar</a>
    <a href="{{ l.explore }}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-size: 11px; font-weight: 600; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m15.5 8.5-2 5-5 2 2-5z"></path></svg>Explorar</a>
    <a href="{{ l.profile }}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-size: 11px; font-weight: 600; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Perfil</a>
  </nav>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"light"},"$preview":{"width":390,"height":1060}}'>
const PAL = {
  dark: { bg:'#0E0D0C', surface:'#181614', elev:'#221F1C', border:'#2E2A26', overlay:'rgba(14,13,12,0.72)', text:'#F4EFE8', text2:'#B3ABA1', muted:'#857C72', primary:'#F5B841', pressed:'#D99A22', onPrimary:'#1A1305', primaryText:'#F5B841', accent:'#E5484D', success:'#46C47E', warning:'#F5B841', error:'#E5484D', hi:'#46C47E', mid:'#F5B841', lo:'#E5484D' },
  light: { bg:'#FAF7F2', surface:'#FFFFFF', elev:'#F2EDE5', border:'#E4DDD2', overlay:'rgba(255,255,255,0.85)', text:'#1A1714', text2:'#5C554D', muted:'#766E64', primary:'#F2AE2E', pressed:'#D99A22', onPrimary:'#1A1305', primaryText:'#8A5A00', accent:'#C9363C', success:'#1F8A50', warning:'#9A6500', error:'#C9363C', hi:'#1F8A50', mid:'#9A6500', lo:'#C9363C' }
};
const rc = (v) => (v >= 7 ? 'var(--hi)' : v >= 5 ? 'var(--mid)' : 'var(--lo)');
const RESULTS = [
  { kind: 'movie', title: 'Noche en Lisboa', meta: '2025 · Drama, Misterio', vote: 8.4 },
  { kind: 'tv', title: 'Lisboa, 1974', meta: '2023 · 2 temporadas', vote: 7.3 },
  { kind: 'person', title: 'Lucía Andrade', meta: 'Actuación · Noche en Lisboa, Marea alta' },
  { kind: 'movie', title: 'Tren a Lisboa', meta: '2019 · Thriller', vote: 5.8 },
  { kind: 'tv', title: 'Puerto de Lisboa', meta: '2021 · 1 temporada', vote: 4.2 },
  { kind: 'person', title: 'Tomás Lisboa', meta: 'Dirección · La hora azul' },
  { kind: 'movie', title: 'Cartas desde Lisboa', meta: '2016 · Romance', vote: 6.6 }
];
const TYPE = { movie: 'Película', tv: 'Serie', person: 'Persona' };
const FILTERS = [['all', 'Todo'], ['movie', 'Películas'], ['tv', 'Series'], ['person', 'Personas']];
class Component extends DCLogic {
  state = { filter: 'all' };
  renderVals() {
    const t = this.props.theme === 'light' ? 'light' : 'dark';
    const vars = {};
    Object.keys(PAL[t]).forEach((k) => { vars['--' + k] = PAL[t][k]; });
    const s = t === 'light' ? 'Light' : '';
    const f = this.state.filter;
    const HREF = { movie: 'MovieDetail' + s + '.html', tv: 'TvDetail' + s + '.html', person: 'Person' + s + '.html' };
    const list = RESULTS.filter((r) => f === 'all' || r.kind === f);
    return {
      vars,
      filters: FILTERS.map(([id, label]) => ({ label, on: f === id, bg: f === id ? 'var(--primary)' : 'var(--elev)', fg: f === id ? 'var(--onPrimary)' : 'var(--text2)', pick: () => this.setState({ filter: id }) })),
      count: list.length + ' resultados para “lisboa”',
      results: list.map((r) => ({
        title: r.title, meta: r.meta, type: TYPE[r.kind], href: HREF[r.kind],
        radius: r.kind === 'person' ? '999px' : '10px', h: r.kind === 'person' ? '56px' : '84px',
        hasVote: r.vote != null, vote: r.vote != null ? r.vote.toFixed(1) : '', color: r.vote != null ? rc(r.vote) : ''
      })),
      l: { home: 'Home' + s + '.html', search: 'Search' + s + '.html', explore: 'Explore' + s + '.html', profile: 'Profile' + s + '.html' }
    };
  }
}
</script>
</body>
</html>
