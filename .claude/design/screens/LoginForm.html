<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Iniciar sesión</title>
<script src="./viewer.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="{{ vars }}">
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 40px; display: flex; flex-direction: column; gap: 32px; background: var(--bg); color: var(--text); font-family: 'Instrument Sans', system-ui, sans-serif">
  <a href="{{ l.back }}" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); color: var(--text); display: flex; align-items: center; justify-content: center; text-decoration: none">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M15 5 8 12l7 7"></path></svg>
  </a>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 32px; line-height: 1.1; letter-spacing: -0.02em">Inicia sesión</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: var(--text2)">Usa el usuario y la contraseña de tu cuenta de themoviedb.org.</p>
  </div>

  <form style="display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="user" style="font-size: 13px; font-weight: 600; color: var(--text2)">Usuario</label>
      <input id="user" type="text" autocomplete="username" placeholder="tu_usuario" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-size: 16px; outline: none">
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="pass" style="font-size: 13px; font-weight: 600; color: var(--text2)">Contraseña</label>
      <div style="position: relative">
        <input id="pass" type="password" autocomplete="current-password" placeholder="••••••••" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 52px 0 16px; border-radius: 14px; border: 1px solid {{ passBorder }}; background: var(--surface); color: var(--text); font: inherit; font-size: 16px; outline: none">
        <button type="button" aria-label="Mostrar contraseña" style="position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; border: 0; background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
      <sc-if value="{{ showError }}" hint-placeholder-val="{{ false }}">
        <span role="alert" style="font-size: 13px; color: var(--error)">Usuario o contraseña incorrectos. Intenta de nuevo.</span>
      </sc-if>
    </div>
    <a href="https://www.themoviedb.org/reset-password" style="align-self: flex-end; font-size: 14px; font-weight: 600; color: var(--primaryText); text-decoration: none">¿Olvidaste tu contraseña?</a>
  </form>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 14px">
    <a href="{{ l.home }}" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 999px; background: var(--primary); color: var(--onPrimary); font-weight: 600; font-size: 16px; text-decoration: none">Iniciar sesión</a>
    <p style="margin: 0; text-align: center; font-size: 14px; color: var(--text2)">¿No tienes cuenta? <a href="https://www.themoviedb.org/signup" style="color: var(--primaryText); font-weight: 600; text-decoration: none">Créala en TMDB</a></p>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"showError":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
const PAL = {
  dark: { bg:'#0E0D0C', surface:'#181614', elev:'#221F1C', border:'#2E2A26', overlay:'rgba(14,13,12,0.72)', text:'#F4EFE8', text2:'#B3ABA1', muted:'#857C72', primary:'#F5B841', pressed:'#D99A22', onPrimary:'#1A1305', primaryText:'#F5B841', accent:'#E5484D', success:'#46C47E', warning:'#F5B841', error:'#E5484D', hi:'#46C47E', mid:'#F5B841', lo:'#E5484D' },
  light: { bg:'#FAF7F2', surface:'#FFFFFF', elev:'#F2EDE5', border:'#E4DDD2', overlay:'rgba(255,255,255,0.85)', text:'#1A1714', text2:'#5C554D', muted:'#766E64', primary:'#F2AE2E', pressed:'#D99A22', onPrimary:'#1A1305', primaryText:'#8A5A00', accent:'#C9363C', success:'#1F8A50', warning:'#9A6500', error:'#C9363C', hi:'#1F8A50', mid:'#9A6500', lo:'#C9363C' }
};
class Component extends DCLogic {
  renderVals() {
    const t = this.props.theme === 'light' ? 'light' : 'dark';
    const vars = {};
    Object.keys(PAL[t]).forEach((k) => { vars['--' + k] = PAL[t][k]; });
    const s = t === 'light' ? 'Light' : '';
    const showError = !!this.props.showError;
    return {
      vars,
      showError,
      passBorder: showError ? 'var(--error)' : 'var(--border)',
      l: { back: 'Main' + s + '.html', home: 'Home' + s + '.html' }
    };
  }
}
</script>
</body>
</html>
