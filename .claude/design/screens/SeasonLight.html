<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Temporada · claro</title>
<script src="./viewer.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="{{ vars }}">
<div style="width: 390px; min-height: 1400px; box-sizing: border-box; padding: 52px 0 48px; background: var(--bg); color: var(--text); font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 22px">
  <div style="padding: 0 16px; display: flex; align-items: center; gap: 12px">
    <a href="{{ l.back }}" aria-label="Volver" style="flex: 0 0 44px; height: 44px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); color: var(--text); display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M15 5 8 12l7 7"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 12px; color: var(--muted)">Distrito Norte</span>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px">Temporadas</h1>
    </div>
  </div>

  <div role="tablist" style="padding: 0 24px; display: flex; gap: 8px">
    <sc-for list="{{ tabs }}" as="s" hint-placeholder-count="4">
      <button role="tab" aria-selected="{{ s.on }}" onClick="{{ s.pick }}" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: {{ s.bg }}; color: {{ s.fg }}; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{ s.label }}</button>
    </sc-for>
  </div>

  <div style="padding: 0 24px; display: flex; gap: 16px">
    <div style="flex: 0 0 96px; height: 144px; border-radius: 12px; border: 1px solid var(--border); background: repeating-linear-gradient(135deg, var(--surface) 0 8px, var(--elev) 8px 16px); display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--muted)">poster_path</div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px">{{ seasonName }}</h2>
      <span style="font-size: 13px; color: var(--text2)">{{ seasonMeta }}</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; color: var(--hi)">★ 7.9</span>
      <p style="margin: 0; font-size: 13px; line-height: 1.5; color: var(--text2)">[overview de la temporada]</p>
    </div>
  </div>

  <ol style="list-style: none; margin: 0; padding: 0 24px; display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{ episodes }}" as="e" hint-placeholder-count="8">
      <li style="display: flex; flex-direction: column; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid var(--border)">
        <div style="display: flex; gap: 14px">
          <div style="flex: 0 0 132px; height: 74px; border-radius: 10px; border: 1px solid var(--border); background: repeating-linear-gradient(135deg, var(--surface) 0 6px, var(--elev) 6px 12px); display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--muted)">still_path</div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--primaryText)">E{{ e.n }}</span>
            <span style="font-size: 15px; font-weight: 600; line-height: 1.25">{{ e.title }}</span>
            <span style="font-size: 12px; color: var(--text2)">{{ e.meta }} · <span style="font-family: 'JetBrains Mono', monospace; color: {{ e.color }}">★ {{ e.vote }}</span></span>
          </div>
        </div>
        <p style="margin: 0; font-size: 13px; line-height: 1.5; color: var(--text2)">[overview del episodio]</p>
      </li>
    </sc-for>
  </ol>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"light"},"$preview":{"width":390,"height":1400}}'>
const PAL = {
  dark: { bg:'#0E0D0C', surface:'#181614', elev:'#221F1C', border:'#2E2A26', overlay:'rgba(14,13,12,0.72)', text:'#F4EFE8', text2:'#B3ABA1', muted:'#857C72', primary:'#F5B841', pressed:'#D99A22', onPrimary:'#1A1305', primaryText:'#F5B841', accent:'#E5484D', success:'#46C47E', warning:'#F5B841', error:'#E5484D', hi:'#46C47E', mid:'#F5B841', lo:'#E5484D' },
  light: { bg:'#FAF7F2', surface:'#FFFFFF', elev:'#F2EDE5', border:'#E4DDD2', overlay:'rgba(255,255,255,0.85)', text:'#1A1714', text2:'#5C554D', muted:'#766E64', primary:'#F2AE2E', pressed:'#D99A22', onPrimary:'#1A1305', primaryText:'#8A5A00', accent:'#C9363C', success:'#1F8A50', warning:'#9A6500', error:'#C9363C', hi:'#1F8A50', mid:'#9A6500', lo:'#C9363C' }
};
const rc = (v) => (v >= 7 ? 'var(--hi)' : v >= 5 ? 'var(--mid)' : 'var(--lo)');
const META = { 1: '2022 · 10 episodios', 2: '2023 · 10 episodios', 3: '2024 · 10 episodios', 4: '2025 · 8 episodios' };
const EPS = [['El primer turno', 7.8], ['Calle sin nombre', 7.4], ['Testigo', 8.2], ['La caída', 8.9], ['Puente roto', 6.7], ['Silencio', 7.1], ['Ruta 40', 4.9], ['Todo vuelve', 8.5]];
class Component extends DCLogic {
  state = { season: 2 };
  renderVals() {
    const t = this.props.theme === 'light' ? 'light' : 'dark';
    const vars = {};
    Object.keys(PAL[t]).forEach((k) => { vars['--' + k] = PAL[t][k]; });
    const s = t === 'light' ? 'Light' : '';
    const cur = this.state.season;
    return {
      vars,
      tabs: [1, 2, 3, 4].map((n) => ({ label: 'T' + n, on: n === cur, bg: n === cur ? 'var(--primary)' : 'var(--elev)', fg: n === cur ? 'var(--onPrimary)' : 'var(--text2)', pick: () => this.setState({ season: n }) })),
      seasonName: 'Temporada ' + cur,
      seasonMeta: META[cur],
      episodes: EPS.map(([title, v], i) => ({ n: i + 1, title, vote: v.toFixed(1), color: rc(v), meta: (i + 3) + ' mar ' + (2021 + cur) + ' · 52 min' })),
      l: { back: 'TvDetail' + s + '.html' }
    };
  }
}
</script>
</body>
</html>
