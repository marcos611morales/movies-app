<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Inicio</title>
<script src="./viewer.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="{{ vars }}">
<div style="width: 390px; height: 2000px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Instrument Sans', system-ui, sans-serif">
  <div style="padding: 56px 0 120px; display: flex; flex-direction: column; gap: 28px">

    <header style="padding: 0 24px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px; color: var(--text2)">Hola, [usuario]</span>
          <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.02em">Movies App</h1>
        </div>
        <a href="{{ l.profile }}" aria-label="Perfil" style="width: 44px; height: 44px; border-radius: 999px; background: var(--elev); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--text2); text-decoration: none">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
        </a>
      </div>
      <div role="tablist" style="display: flex; gap: 8px">
        <sc-for list="{{ modes }}" as="m" hint-placeholder-count="2">
          <button role="tab" aria-selected="{{ m.on }}" style="height: 36px; padding: 0 16px; border-radius: 999px; border: 0; background: {{ m.bg }}; color: {{ m.fg }}; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{ m.label }}</button>
        </sc-for>
      </div>
    </header>

    <section aria-label="Destacadas" style="padding: 0 24px; display: flex; flex-direction: column; gap: 12px">
      <a href="{{ l.detail }}" style="position: relative; display: block; height: 440px; border-radius: 24px; overflow: hidden; border: 1px solid var(--border); background: repeating-linear-gradient(135deg, var(--surface) 0 10px, var(--elev) 10px 20px); color: var(--text); text-decoration: none">
        <span style="position: absolute; top: 40%; left: 0; right: 0; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted)">poster_path</span>
        <span style="position: absolute; top: 14px; left: 14px; padding: 5px 10px; border-radius: 999px; background: var(--overlay); font-size: 12px; font-weight: 600">{{ heroTag }}</span>
        <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 80px 20px 20px; background: linear-gradient(to bottom, transparent, var(--bg)); display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text2)">
            <span style="font-family: 'JetBrains Mono', monospace; font-weight: 500; color: var(--hi)">★ 8.4</span>
            <span>·</span><span>2025</span><span>·</span><span>Drama, Misterio</span>
          </div>
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 28px; line-height: 1.05">{{ heroTitle }}</span>
          <div style="display: flex; gap: 10px; margin-top: 4px">
            <span style="flex: 1; height: 46px; border-radius: 999px; background: var(--primary); color: var(--onPrimary); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 15px">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg>
              Ver tráiler
            </span>
            <span aria-label="Agregar a por ver" style="width: 46px; height: 46px; border-radius: 999px; background: var(--overlay); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.8; stroke-linejoin: round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>
            </span>
          </div>
        </div>
      </a>
      <div aria-hidden="true" style="display: flex; justify-content: center; gap: 6px">
        <span style="width: 20px; height: 6px; border-radius: 999px; background: var(--primary)"></span>
        <span style="width: 6px; height: 6px; border-radius: 999px; background: var(--border)"></span>
        <span style="width: 6px; height: 6px; border-radius: 999px; background: var(--border)"></span>
        <span style="width: 6px; height: 6px; border-radius: 999px; background: var(--border)"></span>
        <span style="width: 6px; height: 6px; border-radius: 999px; background: var(--border)"></span>
      </div>
    </section>

    <sc-for list="{{ sections }}" as="s" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 14px">
        <div style="padding: 0 24px; display: flex; justify-content: space-between; align-items: baseline">
          <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px">{{ s.title }}</h2>
          <a href="{{ s.more }}" style="font-size: 14px; font-weight: 600; color: var(--primaryText); text-decoration: none">Ver todo</a>
        </div>
        <div style="display: flex; gap: 12px; padding: 0 24px; overflow: hidden">
          <sc-for list="{{ s.items }}" as="m" hint-placeholder-count="4">
            <a href="{{ m.href }}" style="flex: 0 0 124px; display: flex; flex-direction: column; gap: 8px; color: var(--text); text-decoration: none">
              <div style="position: relative; height: 186px; border-radius: 14px; border: 1px solid var(--border); background: repeating-linear-gradient(135deg, var(--surface) 0 8px, var(--elev) 8px 16px); display: flex; align-items: center; justify-content: center">
                <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted)">poster_path</span>
                <span style="position: absolute; top: 8px; left: 8px; padding: 3px 7px; border-radius: 8px; background: var(--overlay); color: {{ m.color }}; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500">★ {{ m.vote }}</span>
                <span style="position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 999px; background: var(--overlay); color: {{ m.fav }}; display: flex; align-items: center; justify-content: center">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="{{ m.favFill }}" stroke="currentColor" style="stroke-width: 2; stroke-linejoin: round" aria-hidden="true"><path d="M12 20s-7-4.4-9-9.2C1.7 7.4 4 4 7.3 4c2 0 3.4 1.1 4.7 2.8C13.3 5.1 14.7 4 16.7 4 20 4 22.3 7.4 21 10.8 19 15.6 12 20 12 20z"></path></svg>
                </span>
              </div>
              <span style="font-size: 14px; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ m.title }}</span>
              <span style="font-size: 12px; color: var(--text2); margin-top: -4px">{{ m.year }}</span>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>

  <nav aria-label="Navegación principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 8px 24px; background: var(--surface); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="{{ l.home }}" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--primaryText); font-size: 11px; font-weight: 600; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Inicio</a>
    <a href="{{ l.search }}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-size: 11px; font-weight: 600; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Buscar</a>
    <a href="{{ l.explore }}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-size: 11px; font-weight: 600; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m15.5 8.5-2 5-5 2 2-5z"></path></svg>Explorar</a>
    <a href="{{ l.profile }}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-size: 11px; font-weight: 600; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Perfil</a>
  </nav>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"mode":{"editor":"enum","options":["movies","series"],"default":"movies"},"$preview":{"width":390,"height":2000}}'>
const PAL = {
  dark: { bg:'#0E0D0C', surface:'#181614', elev:'#221F1C', border:'#2E2A26', overlay:'rgba(14,13,12,0.72)', text:'#F4EFE8', text2:'#B3ABA1', muted:'#857C72', primary:'#F5B841', pressed:'#D99A22', onPrimary:'#1A1305', primaryText:'#F5B841', accent:'#E5484D', success:'#46C47E', warning:'#F5B841', error:'#E5484D', hi:'#46C47E', mid:'#F5B841', lo:'#E5484D' },
  light: { bg:'#FAF7F2', surface:'#FFFFFF', elev:'#F2EDE5', border:'#E4DDD2', overlay:'rgba(255,255,255,0.85)', text:'#1A1714', text2:'#5C554D', muted:'#766E64', primary:'#F2AE2E', pressed:'#D99A22', onPrimary:'#1A1305', primaryText:'#8A5A00', accent:'#C9363C', success:'#1F8A50', warning:'#9A6500', error:'#C9363C', hi:'#1F8A50', mid:'#9A6500', lo:'#C9363C' }
};
const rc = (v) => (v >= 7 ? 'var(--hi)' : v >= 5 ? 'var(--mid)' : 'var(--lo)');
const MOVIES = [
  ['Noche en Lisboa', '2025', 8.4, true], ['El último faro', '2024', 6.1, false], ['Marea alta', '2025', 7.2, false],
  ['Los días de ámbar', '2023', 4.6, false], ['Sin señal', '2025', 7.8, true], ['La hora azul', '2024', 5.9, false]
];
const SERIES = [
  ['Distrito Norte', '2022', 8.1, true], ['Casa Vega', '2024', 7.0, false], ['Órbita', '2025', 6.4, false],
  ['Los herederos', '2021', 4.8, false], ['Frontera', '2023', 7.6, false], ['Cuarto oscuro', '2025', 5.5, false]
];
class Component extends DCLogic {
  renderVals() {
    const t = this.props.theme === 'light' ? 'light' : 'dark';
    const vars = {};
    Object.keys(PAL[t]).forEach((k) => { vars['--' + k] = PAL[t][k]; });
    const s = t === 'light' ? 'Light' : '';
    const series = this.props.mode === 'series';
    const detail = (series ? 'TvDetail' : 'MovieDetail') + s + '.html';
    const src = series ? SERIES : MOVIES;
    const items = (off) => [0, 1, 2, 3].map((i) => {
      const [title, year, vote, fav] = src[(i + off) % src.length];
      return { title, year, vote: vote.toFixed(1), color: rc(vote), fav: fav ? 'var(--accent)' : 'var(--text2)', favFill: fav ? 'currentColor' : 'none', href: detail };
    });
    const titles = series
      ? ['Al aire hoy', 'Populares', 'Mejor calificadas', 'En emisión']
      : ['En cartelera', 'Populares', 'Mejor calificadas', 'Próximamente'];
    const explore = 'Explore' + s + '.html';
    return {
      vars,
      modes: [['Películas', !series], ['Series', series]].map(([label, on]) => ({ label, on, bg: on ? 'var(--primary)' : 'var(--elev)', fg: on ? 'var(--onPrimary)' : 'var(--text2)' })),
      heroTag: series ? 'Tendencia de la semana' : 'Tendencia de hoy',
      heroTitle: series ? 'Distrito Norte' : 'Noche en Lisboa',
      sections: titles.map((title, i) => ({ title, more: explore, items: items(i + 1) })),
      l: { detail, home: 'Home' + s + '.html', search: 'Search' + s + '.html', explore, profile: 'Profile' + s + '.html' }
    };
  }
}
</script>
</body>
</html>
